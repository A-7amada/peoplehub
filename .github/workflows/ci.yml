name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      pg:
        image: postgres:17
        env: { POSTGRES_PASSWORD: ci, POSTGRES_DB: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Build
        run: dotnet build -c Release -v q
      - name: Tests (SQLite) plus PostgreSQL migration, restore and decimal tests
        env:
          TEST_POSTGRES: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=ci
        run: dotnet test -c Release --no-build --logger "trx;LogFileName=results.trx" --logger "console;verbosity=minimal"
      - name: Publish failure details to the ci-report branch
        if: failure()
        run: |
          python3 - <<'PY' > /tmp/report.txt
          import xml.etree.ElementTree as ET,glob
          ns={'t':'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
          for f in glob.glob('tests/PeopleHub.Tests/TestResults/*.trx'):
              r=ET.parse(f).getroot()
              for u in r.iter('{%s}UnitTestResult'%ns['t']):
                  if u.get('outcome')=='Failed':
                      m=u.find('.//t:Message',ns); st=u.find('.//t:StackTrace',ns)
                      print('FAILED',u.get('testName')); print((m.text or '')[:1200] if m is not None else ''); print((st.text or '')[:800] if st is not None else ''); print('---')
          PY
          git config user.name ci-bot; git config user.email ci-bot@users.noreply.github.com
          git checkout --orphan ci-report; git rm -rf -q . ; mkdir -p ci-report; { echo "run ${{ github.run_id }} sha ${{ github.sha }}"; cat /tmp/report.txt; } > ci-report/latest.txt
          git add ci-report; git commit -qm "CI failure report"; git push -qf origin ci-report
      - name: Fail if any test was skipped (proves the PostgreSQL tests really ran)
        run: |
          grep -o 'total="[0-9]*" executed="[0-9]*" passed="[0-9]*" failed="[0-9]*"[^>]*' tests/PeopleHub.Tests/TestResults/results.trx | head -1
          if grep -q 'outcome="NotExecuted"' tests/PeopleHub.Tests/TestResults/results.trx; then echo "skipped tests found"; exit 1; fi
